<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .container {
        width: 1000px;
        height: 700px;
      }
      .header {
        width: 100%;
        height: 80px;
        background-color: navy;
        color: white;
      }
      .nav {
        width: 100%;
        height: 40px;
        background-color: skyblue;
      }
      .body-wrap {
        display: flex;
        width: 100%;
        height: 480px;
        border: 3px solid orange;
      }
      .body-wrap .left {
        width: 20%;
        height: 100%;
        background-color: lightgreen;
      }
      .body-wrap .main {
        width: 60%;
        height: 100%;
        border: 3px solid red;
      }
      .body-wrap .main .main-top {
        width: 100%;
        height: 300px;
        background-color: white;
      }
      .body-wrap .main .main-bottom {
        width: 100%;
        height: 180px;
        background-color: lightgray;
      }
      .body-wrap .right {
        width: 20%;
        height: 100%;
        background-color: pink;
      }
      .footer {
        width: 100%;
        height: 100px;
        background-color: gray;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header"></div>
      <div class="nav"></div>
      <div class="body-wrap">
        <div class="left"></div>
        <div class="main">
          <div class="main-top"></div>
          <div class="main-bottom"></div>
        </div>
        <div class="right"></div>
      </div>
      <div class="footer"></div>
    </div>
  </body>
</html>
